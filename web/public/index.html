<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netshooter LAN</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05080d;color:#eef;font:14px system-ui}#hud{position:fixed;inset:16px auto auto 16px;background:#0a1020cc;padding:12px 14px;border:1px solid #41638f;border-radius:8px;z-index:2}#lobby{position:fixed;inset:0;display:grid;place-items:center;background:#05080df2;z-index:3}.card{width:min(430px,88vw);background:#101a2d;padding:28px;border:1px solid #5279ad;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:11px;margin-top:10px;border-radius:6px;border:1px solid #5978a0;background:#091323;color:#fff}button{background:#e7a20c;color:#111;font-weight:bold;cursor:pointer}</style></head><body>
<div id="lobby"><div class="card"><h1>Netshooter — LAN lobby</h1><p>Хост: <code id="host"></code></p><input id="name" maxlength="16" value="Player" placeholder="Имя игрока"><button id="join">Подключиться</button><p>WASD — движение · мышь — обзор · ЛКМ — пистолет<br>Урон пока отключён.</p></div></div>
<div id="hud">Этаж: <span id="floor">1</span>/5<br><span id="status">Лобби</span><br>Пистолет: готов</div>
<script type="module" src="./main.js"></script></body></html>
